<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robótica - Fundamental 1 | Helena</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #14213d, #2b6cb0);
      color: #fff;
      padding: 2rem;
    }
    main {
      max-width: 640px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 0.5rem; font-size: clamp(1.6rem, 4vw, 2.4rem); }
    p { margin: 0.5rem 0; line-height: 1.6; opacity: 0.92; }
    .badge { font-size: 2.5rem; margin-bottom: 0.5rem; }
    ul { list-style: none; padding: 0; margin: 1.5rem 0 0; display: grid; gap: 0.4rem; }
    li { font-size: 0.95rem; opacity: 0.9; }
  </style>
</head>
<body>
  <main>
    <div class="badge">🤖</div>
    <h1>Robótica — Fundamental 1</h1>
    <p>Turma da Helena</p>
    <p>Projeto em construção.</p>
    <ul>
      <li>Criado por Alice Navarro, Alice Frassi, Maria Luiza e Livia Furlan</li>
    </ul>
  </main>
</body>
</html>
